<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Typewriter Piano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0c'/%3E%3Ctext x='5' y='22' font-family='Inter,sans-serif' font-size='16' font-weight='600' fill='%23ededed'%3Ek%3C/text%3E%3Crect x='16' y='19' width='7' height='2' fill='%23ededed'/%3E%3C/svg%3E">
<style>
:root, [data-theme="dark"] {
  --bg: #0a0a0c;
  --surface: #121215;
  --border: #26262b;
  --border-control: #6b6b72;
  --ink: #ededed;
  --muted: #8e8e93;
  --signal: #00ff85;
  --signal-text: #00ff85;
  --signal-wash: #00ff8524;
  --on-signal: #0a0a0c;
  --shadow-glow: 0 0 14px #00ff8566;
  color-scheme: dark;
}
[data-theme="light"] {
  --bg: #f7f7f5;
  --surface: #ffffff;
  --border: #e2e2de;
  --border-control: #8a8a90;
  --ink: #0a0a0c;
  --muted: #5c5c63;
  --signal: #00a352;
  --signal-text: #00803f;
  --signal-wash: #00a35224;
  --on-signal: #0a0a0c;
  --shadow-glow: 0 0 12px #00a35255;
  color-scheme: light;
}
:root {
  --fg: var(--ink);
  --rule: var(--border);
  --accent: var(--signal);
  --accent-soft: var(--signal-wash);
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 6px;
  --font-sans: "Geist", "Inter", system-ui, -apple-system, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", monospace;
}
* { box-sizing: border-box; }
html, body {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}
body {
  margin: 0;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  background: var(--bg);
  color: color-mix(in srgb, var(--ink) 92%, transparent);
  font: 400 15px/24px var(--font-sans);
  letter-spacing: -0.005em;
}
.wrap {
  flex: 1;
  min-height: 0;
  width: 100%;
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(8px, 2dvh, 28px);
  padding: clamp(8px, 2dvh, 24px);
  overflow: hidden;
  text-align: center;
}
.head, .stage, details, .score, .pick { width: 100%; min-width: 0; max-width: 100%; }
.kai-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-6);
  padding: 20px max(var(--space-8), env(safe-area-inset-left, 0px)) 20px max(var(--space-8), env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--border);
}
.kai-header__brand { display: flex; flex-direction: column; align-items: flex-start; }
.kai-mark {
  display: inline-flex;
  align-items: baseline;
  font-family: var(--font-sans);
  font-weight: 600;
  font-size: 28px;
  line-height: 1;
  letter-spacing: -0.035em;
  color: var(--ink);
  font-optical-sizing: auto;
}
.kai-dot {
  display: inline-block;
  width: 0.28em;
  height: 0.09em;
  margin: 0 0.02em;
  background: var(--ink);
  transition: background-color 0.24s ease;
}
.kai-sub {
  margin-top: var(--space-2);
  font: 400 11px/16px var(--font-mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.eyebrow {
  margin: 0;
  font: 400 11px/16px var(--font-mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.top {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  flex: none;
  align-self: center;
  max-width: calc(100vw - 32px);
  margin-top: max(16px, env(safe-area-inset-top, 0px));
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  align-self: center;
  flex: none;
  max-width: calc(100vw - 32px);
  min-width: 0;
  margin-top: 0;
  padding: 10px 16px 10px 22px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink);
  font: 600 15px/1.2 var(--font-sans);
  letter-spacing: -0.02em;
  cursor: pointer;
}
#songTitle {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.chevron {
  width: 12px;
  height: 12px;
  flex: none;
  color: var(--muted);
}
.badge:focus-visible, .song-list button:focus-visible {
  outline: 2px solid var(--signal);
  outline-offset: 3px;
}
.sheet {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  overflow: hidden;
}
.sheet[hidden] { display: none !important; }
.song-list {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.15em;
  width: 100%;
  max-height: 100%;
  margin: 0;
  padding: 24px;
  overflow: hidden;
  list-style: none;
}
.song-list button {
  border: none;
  background: transparent;
  color: var(--muted);
  font: 600 1em/1.15 var(--font-sans);
  letter-spacing: -0.03em;
  text-align: center;
  padding: 0.12em 0.4em;
  border-radius: 999px;
  cursor: pointer;
}
.song-list button[aria-current="true"] { color: var(--ink); }
.stage {
  flex: 1;
  min-height: 0;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(8px, 1.6dvh, 20px);
  outline: none;
  cursor: text;
}
.ticker {
  position: relative;
  flex: 1;
  width: 100%;
  min-height: 0;
  overflow: hidden;
}
.track {
  position: absolute;
  left: 0;
  top: 50%;
  white-space: nowrap;
  font-family: var(--font-sans);
  font-weight: 500;
  font-size: clamp(2.4rem, 6vw, 4.4rem);
  line-height: 1.7;
  letter-spacing: -0.03em;
  color: var(--ink);
}
.phrase-gap { display: inline-block; width: 2.4em; }
.slot {
  position: absolute;
  left: 50%;
  top: 12%;
  bottom: 12%;
  width: 2px;
  transform: translateX(-50%);
  background: var(--signal);
  opacity: 0.55;
  pointer-events: none;
}
.chip {
  position: absolute;
  left: 50%;
  z-index: 2;
  min-width: 2.4rem;
  height: 2.6rem;
  padding: 0 0.45rem;
  display: grid;
  place-items: center;
  transform: translate(-50%, -50%);
  background: var(--signal);
  color: var(--on-signal);
  font: 700 1.35rem/1 var(--font-sans);
  border-radius: 4px;
  pointer-events: none;
}
.w { display: inline; }
.todo { color: var(--muted); }
.done { color: var(--ink); }
.tone-key { position: relative; }
.tone-key::before {
  content: attr(data-note);
  position: absolute;
  left: 50%;
  top: -0.34em;
  transform: translateX(-50%);
  font: 500 0.24em/1 var(--font-mono);
  letter-spacing: 0;
  white-space: nowrap;
  pointer-events: none;
}
.tone-key.ahead { box-shadow: inset 0 -0.07em 0 var(--border-control); }
.tone-key.ahead::before { color: var(--muted); }
.tone-key.played { box-shadow: inset 0 -0.07em 0 var(--signal); }
.tone-key.played::before { color: var(--ink); }
.tone-key.live { color: var(--signal-text); background: var(--signal-wash); border-radius: var(--radius-sm); box-shadow: inset 0 -0.07em 0 var(--signal); }
.tone-key.live::before { color: var(--signal-text); }
.next { box-shadow: inset 0 -0.09em 0 var(--ink); animation: caret 1s steps(1) infinite; }
.stage.armed .next { box-shadow: inset 0 -0.09em 0 var(--signal); }
@keyframes caret { 50% { box-shadow: inset 0 -0.09em 0 transparent; } }
@keyframes nudge { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.miss .next { animation: nudge .16s 1; display: inline-block; }
.empty { margin: 0; color: var(--muted); font: 500 1.5rem/1.3 var(--font-sans); }
.statusbar {
  display: flex;
  justify-content: center;
  align-items: center;
  flex: none;
  gap: 8px 12px;
  max-width: 100%;
  color: var(--muted);
  font: 400 13px/20px var(--font-mono);
  white-space: nowrap;
}
.statusbar .spacer { display: none; }
.dot { display: none; width: 6px; height: 6px; border-radius: 50%; background: var(--signal); flex: none; }
.stage.armed .dot { display: block; animation: kai-live 2s ease-out infinite; }
@keyframes kai-live {
  0% { box-shadow: 0 0 0 0 var(--signal-wash); }
  70% { box-shadow: 0 0 0 7px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}
details { padding-top: 8px; }
summary {
  cursor: pointer;
  color: var(--muted);
  font: 400 11px/16px var(--font-mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  list-style: none;
  margin-inline: auto;
}
summary::-webkit-details-marker { display: none; }
summary:hover { color: var(--fg); }
summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.score {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: var(--space-4);
  margin-top: var(--space-6);
  padding: var(--space-6);
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}
.hint { margin: 0; color: var(--muted); font: 400 13px/20px var(--font-sans); max-width: 62ch; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); gap: 18px; width: 100%; }
.field { display: flex; flex-direction: column; align-items: stretch; gap: 8px; min-width: 0; width: 100%; }
.lab { font: 400 11px/16px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.field small { color: var(--muted); font: 400 13px/20px var(--font-sans); }
textarea, input[type="text"] {
  width: 100%;
  padding: 10px 12px;
  border-radius: var(--radius-md);
  text-align: left;
  background: var(--bg);
}
textarea { font: 400 15px/24px var(--font-sans); min-height: 8rem; resize: vertical; }
#notesIn { font: 400 13px/20px var(--font-mono); }
input[type="text"] { font: 500 16px/24px var(--font-sans); }
.actions { display: flex; flex-wrap: wrap; justify-content: flex-start; align-items: center; gap: 8px 12px; }
button { cursor: pointer; padding: 6px 12px; font: 500 13px/20px var(--font-sans); transition: border-color 0.16s ease; }
button:hover { border-color: var(--ink); }
button:disabled { opacity: .4; cursor: default; border-color: var(--border); }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; color: var(--muted); }
.check input { accent-color: var(--accent); }
.info { color: var(--muted); font: 400 13px/20px var(--font-mono); min-width: 0; }
#lineCheck { width: 100%; }
.tablewrap { overflow: auto; max-height: 16rem; border: 1px solid var(--border); border-radius: var(--radius-md); margin-top: 12px; text-align: left; }
table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
th, td { padding: 8px 14px; text-align: left; white-space: nowrap; }
th { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--rule); font-weight: 500; color: var(--muted); }
tr.off td { background: var(--accent-soft); }
tr.ok td:last-child { color: var(--muted); }
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  border: 0;
}
@media (max-width: 720px) {
  .kai-header { padding: var(--space-4); }
}
@media (prefers-reduced-motion: reduce) {
  .next, .miss .next, .stage.armed .dot { animation: none; }
}
.credit {
  position: fixed;
  right: max(14px, env(safe-area-inset-right));
  bottom: max(12px, env(safe-area-inset-bottom));
  z-index: 2;
  display: inline-flex;
  align-items: baseline;
  gap: 0.4em;
  color: var(--ink);
  text-decoration: none;
  font: 400 11px/1 var(--font-sans);
}
.credit:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; }
.credit .kai-mark { font-size: 13px; color: inherit; }
.kai-dot--signal { background: var(--signal); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="top">
  <button type="button" class="badge" id="songBadge" aria-haspopup="dialog" aria-expanded="false" aria-controls="songSheet">
    <span id="songTitle">Song</span>
    <svg class="chevron" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 L6 8 L9.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>
<main class="wrap">
  <section class="stage" id="stage" tabindex="0" aria-label="Typing stage. Type the lyrics to play the melody.">
    <div class="ticker" id="ticker">
      <div class="track" id="lyrics"></div>
      <div class="slot" aria-hidden="true"></div>
      <div class="chip" id="chip" hidden></div>
    </div>
    <div class="statusbar">
      <span class="dot" aria-hidden="true"></span>
      <span id="status">Loading songs</span>
      <span class="spacer"></span>
      <span id="count"></span>
    </div>
  </section>

</main>
<div class="sheet" id="songSheet" hidden role="dialog" aria-modal="true" aria-label="Songs">
  <ul class="song-list" id="songList"></ul>
</div>
<a class="credit" href="https://www.linkedin.com/in/kaipeters1337/" target="_blank" rel="noopener noreferrer">
  <span class="credit-label">Built by</span>
  <span class="kai-mark">k<span class="kai-dot kai-dot--signal" aria-hidden="true"></span>ai</span>
</a>
<script type="module" src="js/app.js"></script>

  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
